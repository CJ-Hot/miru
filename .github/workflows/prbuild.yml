name: Dev Build CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  build-and-release-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.16.8
          channel: stable

      - name: Decode keystore
        run: |
          echo "$ENCODED_KEYSTORE" | base64 -di > android/app/keystore.jks || true
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE }}

      - run: flutter pub get

      - name: Collect Apks
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/app/outputs/flutter-apk/

  build-and-release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.16.8
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Rename
        run: mv build/windows/x64/runner/Release build/windows/x64/runner/Miru-App
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/runner/Miru-App

  build-and-release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Fix Ubuntu APT Sources
        run: |
          sudo rm -f /etc/apt/sources.list.d/*
          sudo rm -f /etc/apt/apt-mirrors.txt
          echo "deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu noble-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt clean
          sudo apt update -y || true

      - name: Install Dependencies
        run: sudo apt-get install -y --fix-missing ninja-build build-essential libgtk-3-dev libmpv-dev mpv

      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.16.8
          channel: stable

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Rename
        run: mv build/linux/x64/release/bundle build/linux/x64/release/Miru-App

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux/x64/release/Miru-App

  # ==========================================
  # 🔥 自动发布到 GitHub Releases（核心新增）
  # ==========================================
  release:
    needs: [build-and-release-android, build-and-release-windows, build-and-release-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dev Build ${{ github.sha }}
          tag_name: dev-${{ github.run_number }}
          files: |
            apks/*
            windows/*
            linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
