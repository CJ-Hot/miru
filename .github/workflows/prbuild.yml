name: Dev Build CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  build-and-release-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.16.8
          channel: stable

      - name: Decode Keystore
        run: |
          echo "$ENCODED_KEYSTORE" | base64 -di > android/app/keystore.jks || true
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE }}

      - run: flutter pub get

      # 🔥 关键：只打一个单独APK（通用所有安卓）
      - name: Build APK
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 🔥 只上传一个APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          path: build/app/outputs/flutter-apk/app-release.apk
          name: Miru-${{ github.event.number || 'dev' }}-Android.apk

  build-and-release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.16.8
          channel: stable

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package to ZIP
        run: |
          mv build/windows/x64/runner/Release build/windows/x64/runner/Miru-App
          Compress-Archive -Path build/windows/x64/runner/Miru-App -DestinationPath build/windows/Miru-Windows.zip -Force

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          path: build/windows/Miru-Windows.zip
          name: Miru-${{ github.event.number || 'dev' }}-Windows.zip

  build-and-release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Fix APT Sources
        run: |
          sudo rm -f /etc/apt/sources.list.d/*
          sudo rm -f /etc/apt/apt-mirrors.txt
          echo "deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu noble-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt clean
          sudo apt update -y --fix-missing || true

      - name: Install Dependencies
        run: sudo apt-get install -y --fix-missing ninja-build build-essential libgtk-3-dev libmpv-dev mpv zip

      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.16.8
          channel: stable

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package to ZIP
        run: |
          mv build/linux/x64/release/bundle build/linux/x64/release/Miru-App
          zip -r build/linux/Miru-Linux.zip build/linux/x64/release/Miru-App

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          path: build/linux/Miru-Linux.zip
          name: Miru-${{ github.event.number || 'dev' }}-Linux.zip
