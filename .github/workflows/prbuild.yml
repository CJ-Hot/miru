name: Dev Build CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  build-and-release-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.16.8
          channel: stable

      - name: Decode keystore
        run: |
          echo "$ENCODED_KEYSTORE" | base64 -di > android/app/keystore.jks || true
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE }}

      - run: flutter pub get

      - name: Collect Apks
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Artifact - armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          name: Miru-${{ github.event.number || 'dev' }}-armeabi-v7a.apk

      - name: Upload Artifact - arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          name: Miru-${{ github.event.number || 'dev' }}-arm64-v8a.apk

      - name: Upload Artifact - x86_64
        uses: actions/upload-artifact@v4
        with:
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          name: Miru-${{ github.event.number || 'dev' }}-x86_64.apk

  build-and-release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.16.8
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Rename Release Directory
        run: |
          mv build/windows/x64/runner/Release build/windows/x64/runner/Miru-App
      - uses: actions/upload-artifact@v4
        with:
          path: build/windows/x64/runner/Miru-App
          name: Miru-${{ github.event.number || 'dev' }}-windows.zip

  build-and-release-linux:
    runs-on: ubuntu-latest
    steps:
      # ==================== 彻底解决 apt-mirrors.txt 问题（关键）====================
      - name: 彻底屏蔽失效的 apt-mirrors.txt 源
        run: |
          sudo rm -rf /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors.txt.d/
          sudo touch /etc/apt/apt-mirrors.txt
          sudo chattr +i /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/sources.list > /dev/null <<'EOF'
deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
deb http://archive.ubuntu.com/ubuntu noble-security main restricted universe multiverse
EOF
          sudo apt clean
          sudo apt update -y --fix-missing || true

      - name: 安装项目依赖
        run: sudo apt-get install -y --fix-missing ninja-build build-essential libgtk-3-dev libmpv-dev mpv

      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.16.8
          channel: stable

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Rename Release Directory
        run: mv build/linux/x64/release/bundle build/linux/x64/release/Miru-App

      - uses: actions/upload-artifact@v4
        with:
          path: build/linux/x64/release/Miru-App
          name: Miru-${{ github.event.number || 'dev' }}-linux.zip
